# CodePlayground (PKPilot0013) — build, test and publish to GitHub Pages.
#
# The App token used by the assistant cannot write under `.github/workflows/`, so
# this file is kept here for the repository owner to install once at
# `.github/workflows/deploy.yml`. It is the current deployed workflow plus the
# `@smoke` E2E step (WO-06).
name: Deploy PKPilot0013 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (layouts, state sync, chat completion streaming)
        # Includes the Chat Completion @smoke case: Mock Mode run, streamed chunks,
        # stale-after-settings-change, and a local CORS-allowed/denied provider.
        run: npx playwright test --grep @smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
